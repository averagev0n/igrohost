<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Игрохост</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <form id="login" class="login">
    <img src="icon.svg" alt="" width="56" height="56">
    <h1>Игрохост</h1>
    <p class="lead">Введите ПИН-код. Он показан в панели на компьютере: «Связь» → «Телефон».</p>
    <input id="pin" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" aria-label="ПИН-код" required>
    <button type="submit" class="btn primary big">Войти</button>
    <p id="err" class="err-text" role="alert"></p>
  </form>
  <script src="login.js"></script>
</body>
</html>
